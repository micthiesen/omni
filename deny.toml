# cargo-deny policy (see docs/architecture.md).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # webpki-roots 0.26.11 is the last 0.26 release and only re-exports the
  # webpki-roots 1.x roots, which are locked at the patched 1.0.10. It reaches
  # only sherpa-onnx-sys's build-time downloader (ureq 2.12.1); remove this
  # entry once sherpa-onnx moves off ureq 2.
  { id = "RUSTSEC-2026-0381", reason = "shim over the patched webpki-roots 1.0.10, build-time only" },
  # paste is archived. It reaches only the wasm frontend, through leptos,
  # reactive_graph, reactive_stores, tachys and either_of, as a proc macro with
  # no runtime code. The pinned leptos 0.8.20 still requires it; remove this
  # entry once a leptos upgrade drops paste.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro reached only through leptos 0.8.20" },
  # zip 2.4.2 is a build-dependency of sherpa-onnx-sys 1.13.8, which pins zip
  # ^2 and extracts only the upstream iOS xcframework archive with it. Omni
  # builds for Linux and macOS (bzip2 tarballs or SHERPA_ONNX_LIB_DIR), so the
  # extraction code never runs. Remove once sherpa-onnx-sys allows zip >= 9.
  { id = "RUSTSEC-2026-0367", reason = "zip extraction reached only for iOS sherpa-onnx archives, never built" },
  { id = "RUSTSEC-2026-0368", reason = "zip extraction reached only for iOS sherpa-onnx archives, never built" },
  { id = "RUSTSEC-2026-0369", reason = "zip extraction reached only for iOS sherpa-onnx archives, never built" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  # MIT without the attribution clause (borrow-or-share, via jsonschema).
  "MIT-0",
  # Public-domain-equivalent BSD (quoted_printable, via lettre).
  "0BSD",
  # The permissive BSD-style libbzip2 license (libbz2-rs-sys, via bashkit's bzip2 builtin).
  "bzip2-1.0.6",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
