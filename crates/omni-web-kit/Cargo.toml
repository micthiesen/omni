[package]
name = "omni-web-kit"
description = "Leptos CSR kit for the Omni frontend: API client, live data, hooks, components, charts, markdown, utils."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
omni-api.workspace = true
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
gloo-net.workspace = true
gloo-timers.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
pulldown-cmark.workspace = true
futures.workspace = true

[dependencies.web-sys]
workspace = true
features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "CssStyleDeclaration",
  "DomTokenList",
  "Document",
  "DomRect",
  "DomRectList",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "FocusEvent",
  "FocusOptions",
  "History",
  "HtmlAnchorElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "MessageEvent",
  "MouseEvent",
  "Node",
  "NodeList",
  "PointerEvent",
  "PopStateEvent",
  "PopStateEventInit",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Storage",
  "Url",
