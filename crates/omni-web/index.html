<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0d" />
    <meta name="apple-mobile-web-app-title" content="Omni" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-v2.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Omni</title>
    <link rel="preload" href="/assets/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link data-trunk rel="css" href="style/tokens.css" data-target-path="assets" />
    <link data-trunk rel="css" href="style/base.css" data-target-path="assets" />
    <link data-trunk rel="css" href="style/components.css" data-target-path="assets" />
    <link data-trunk rel="css" href="style/layout.css" data-target-path="assets" />
    <link data-trunk rel="css" href="style/pages/ops.css" data-target-path="assets" />
    <link data-trunk rel="css" href="style/pages/domain.css" data-target-path="assets" />
    <link data-trunk rel="copy-dir" href="assets/fonts" data-target-path="assets/fonts" />
    <!-- Icons keep stable names outside the immutable /assets/ cache. -->
    <link data-trunk rel="copy-dir" href="icons" data-target-path="icons" />
    <link data-trunk rel="copy-file" href="icons/favicon.ico" />
    <link data-trunk rel="copy-file" href="icons/apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="icons/manifest.webmanifest" />
    <link
      data-trunk
      rel="rust"
      href="Cargo.toml"
      data-bin="omni-web"
      data-integrity="none"
      data-target-path="assets"
      data-wasm-opt="z"
      data-cargo-profile-release="wasm-release"
    />
    <script data-trunk src="js/boot.js" type="module" data-target-path="assets"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
