name: executor-events
services:
  executor-events-adapter:
    image: ghcr.io/micthiesen/executor-events-adapter:latest
    container_name: executor-events-adapter
    restart: unless-stopped
    environment:
      # Interpolated from Boris's main .env, the same value Omni receives, so a
      # rotated token reaches the adapter on the next deploy check.
      OMNI_MCP_TOKEN: ${OMNI_MCP_TOKEN:?Set OMNI_MCP_TOKEN in the main Compose .env}
      EXECUTOR_BASE_URL: http://executor:4788
      OMNI_BASE_URL: http://omni:8080
      PUBLIC_MCP_ORIGIN: https://mcp.syas.ca
      EXECUTOR_ALLOWED_USER_ID: ${EXECUTOR_ALLOWED_USER_ID:?Set the existing Executor owner ID}
      PORT: "4789"
    networks: [integrations]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    # The image's HEALTHCHECK probes /health with
    # `executor-events-adapter healthcheck`, so no override here.
networks:
  integrations:
    external: true
    name: compose_agent-integrations
