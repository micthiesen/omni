name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # The Slate hardware project has its own workflow and never enters the image.
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs; the comment names the release.
#
# The checks run as two parallel jobs, lint and test, so neither waits on the
# other's compile. Each keeps its own Rust cache: clippy writes check metadata
# (native and wasm32) while tests write full debug builds, and one shared entry
# would hold whichever job saved first and leave the other cold.
#
# The image build starts beside them instead of after: it is the longest job and
# needs nothing from the checks. It writes its layers to the GitHub Actions cache
# without pushing. `publish` runs only after lint, test and image all pass and
# repeats the same build, which is then fully cached, to push the image; nothing
# untested reaches the registry. Pull requests build the image to prove the
# Dockerfile but neither push nor write the shared caches.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Native and wasm32 clippy artifacts of this job only; the key already
          # covers the rustc version, Cargo.lock and rust-toolchain.toml.
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the verified sherpa-onnx static library
        # Clippy runs build scripts too, including sherpa-onnx-sys's, which reads it.
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint the web crates for wasm32
        run: >-
          cargo clippy -p omni-web -p omni-web-kit -p omni-web-pages
          --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: Check crate dependency direction
        run: cargo xtask deps-check

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components. Tests run on
        # the host target only, so wasm32 is not installed here.
        run: rustup toolchain install

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Native test builds of this job only.
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Fetch the verified sherpa-onnx static library
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.143

      - name: Run tests
        # The ci profile in .config/nextest.toml: no retries, no fail-fast, and
        # hung tests are terminated. The workspace has no doctests, which nextest
        # would skip; add `cargo test --workspace --locked --doc` if that changes.
        run: cargo nextest run --workspace --locked --profile ci

  # The image's web stage runs the release trunk build with the pinned tools, so
  # the frontend build is checked here rather than in lint or test.
  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          # Same build args as publish, so its build is a cache hit.
          build-args: OMNI_REVISION=${{ github.sha }}
          # mode=max keeps every stage, including the cargo-chef dependency layers.
          cache-from: type=gha,scope=omni
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=omni,mode=max,ignore-error=true' || '' }}

  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, image]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        # Same inputs as the image job, so every step is a cache hit.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: OMNI_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/omni:latest
            ghcr.io/${{ github.repository_owner }}/omni:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=omni

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, image, publish]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint.result == 'failure' || needs.test.result == 'failure' ||
      needs.image.result == 'failure' || needs.publish.result == 'failure')

    steps:
      - name: Send CI failure notification
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          TITLE="omni CI failed"
          FAILED=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILED="lint"
          [ "${{ needs.test.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }test"
          [ "${{ needs.image.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }image"
          [ "${{ needs.publish.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }publish"
          MESSAGE="Failed jobs: ${FAILED}"
          curl -s -o /dev/null \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=$TITLE" \
            --form-string "message=$MESSAGE" \
            --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View run" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
