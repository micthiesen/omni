name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # The Slate hardware project has its own workflow and never enters the image.
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml
  pull_request:
    branches:
      - main
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental output is never reused across CI runs and doubles the cache.
  CARGO_INCREMENTAL: 0

# Actions are pinned to full commit SHAs; the comment names the release.
#
# lint, test and server start together. Each restores its own whole-target
# cache (.github/actions/cargo-cache) saved by the newest main commit, with
# file mtimes set to commit times, so only crates changed since then rebuild.
# See docs/ci.md.
#
# server compiles the release binaries in the Dockerfile's own Rust image (same
# glibc as the runtime); image packages them (SERVER_SOURCE=prebuilt) and writes
# its layers to the GitHub Actions cache without pushing. publish runs only after
# lint, test and image pass and repeats the same build, then fully cached, to
# push; nothing untested reaches the registry. Pull requests build everything but
# neither push nor save caches.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Restore the lint build
        uses: ./.github/actions/cargo-cache
        with:
          name: lint
          mode: restore

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        # Clippy runs build scripts too, including sherpa-onnx-sys's, which reads it.
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint the web crates for wasm32
        run: >-
          cargo clippy -p omni-web -p omni-web-kit -p omni-web-pages
          --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: Save the lint build
        uses: ./.github/actions/cargo-cache
        with:
          name: lint
          mode: save

      - name: Check crate dependency direction
        run: cargo xtask deps-check

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components. Tests run on
        # the host target only, so wasm32 is not installed here.
        run: rustup toolchain install

      - name: Restore the test build
        uses: ./.github/actions/cargo-cache
        with:
          name: test
          mode: restore

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.143

      - name: Run tests
        # The ci profile in .config/nextest.toml: no retries, no fail-fast, and
        # hung tests are terminated. The workspace has no doctests, which nextest
        # would skip; add `cargo test --workspace --locked --doc` if that changes.
        run: cargo nextest run --workspace --locked --profile ci

      - name: Drop the linked test executables before saving
        # Each links the whole dependency graph (4.5 GB together, most of the
        # cache quota); relinking them costs less than storing them. Proc-macro
        # libraries (.so) and build scripts stay, or their dependents rebuild.
        if: success() || failure()
        run: >-
          find target/debug/deps -maxdepth 1 -type f -perm -u+x
          ! -name '*.so' ! -name '*.d' -delete

      - name: Save the test build
        # A failing test still leaves a valid build to start the fix from.
        if: success() || failure()
        uses: ./.github/actions/cargo-cache
        with:
          name: test
          mode: save

  # The release binaries, built where they will run: the Dockerfile's Rust image
  # (Debian bookworm, like the node:*-slim runtime), with the same packages and
  # profile as the Dockerfile's server-build stage.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: rust:1.97.1-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checkout
        # The container runs as root over a checkout owned by the runner user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the pinned Rust toolchain and zstd for the cache
        run: |
          rustup toolchain install
          apt-get update -qq && apt-get install -y -qq zstd

      - name: Restore the release build
        uses: ./.github/actions/cargo-cache
        with:
          name: release-server
          mode: restore
          cargo-home: /usr/local/cargo

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Build the release binaries
        run: >-
          cargo build --release --locked -p omni -p omni-live-intel
          --bin omni --bin omni-voice-enroll --bin omni-intel-doctor

      - name: Save the release build
        uses: ./.github/actions/cargo-cache
        with:
          name: release-server
          mode: save
          cargo-home: /usr/local/cargo

      - name: Package the binaries
        # A tarball keeps the executable bits that artifacts drop.
        run: >-
          tar -C target/release -cf server.tar
          omni omni-voice-enroll omni-intel-doctor

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server.tar
          retention-days: 1
          if-no-files-found: error

  # The image's web stage runs the release trunk build with the pinned tools, so
  # the frontend build is checked here rather than in lint or test.
  image:
    runs-on: ubuntu-latest
    needs: server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the server binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server

      - name: Unpack the server binaries into the build context
        run: mkdir -p prebuilt/server && tar -C prebuilt/server -xf server.tar && rm server.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          # Same build args as publish, so its build is a cache hit.
          build-args: |
            OMNI_REVISION=${{ github.sha }}
            SERVER_SOURCE=prebuilt
          # mode=max keeps every stage, including the cargo-chef dependency layers.
          cache-from: type=gha,scope=omni
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=omni,mode=max,ignore-error=true' || '' }}

  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, image]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the server binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server

      - name: Unpack the server binaries into the build context
        run: mkdir -p prebuilt/server && tar -C prebuilt/server -xf server.tar && rm server.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        # Same inputs as the image job, so every step is a cache hit.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            OMNI_REVISION=${{ github.sha }}
            SERVER_SOURCE=prebuilt
          tags: |
            ghcr.io/${{ github.repository_owner }}/omni:latest
            ghcr.io/${{ github.repository_owner }}/omni:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=omni

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  # Each main commit saves its own Cargo cache keys, so delete superseded ones
  # before they crowd the repository's 10 GB cache quota: keep the newest entry
  # of each cache name (grouped without the commit and toolchain hash, so a
  # toolchain bump drops the old toolchain's build too). Also removes the retired Swatinem/rust-cache entries.
  prune:
    runs-on: ubuntu-latest
    needs: [lint, test, server]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded Cargo caches
        run: |
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,createdAt \
            --jq '(map(select(.key | startswith("v0-rust-"))) | .[].id),
                  (map(select(.key | startswith("cargo-")))
                   | group_by(.key | split("-")[:-2] | join("-"))
                   | map(sort_by(.createdAt) | .[:-1][]) | .[].id)' |
          while read -r id; do gh cache delete "$id"; done

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, server, image, publish]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint.result == 'failure' || needs.test.result == 'failure' ||
      needs.server.result == 'failure' || needs.image.result == 'failure' ||
      needs.publish.result == 'failure')

    steps:
      - name: Send CI failure notification
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          TITLE="omni CI failed"
          FAILED=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILED="lint"
          [ "${{ needs.test.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }test"
          [ "${{ needs.server.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }server"
          [ "${{ needs.image.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }image"
          [ "${{ needs.publish.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }publish"
          MESSAGE="Failed jobs: ${FAILED}"
          curl -s -o /dev/null \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=$TITLE" \
            --form-string "message=$MESSAGE" \
            --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View run" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
