name: Build and Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # The Slate hardware project has its own workflow and never enters the image.
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml
      # Prose, agent instructions and the iOS app never reach the image or a
      # Rust test. docs/mcp-policy.json (read by omni-mcp tests) and
      # docs/licenses/ (copied into the image) still trigger a run.
      - 'docs/**/*.md'
      - AGENTS.md
      - README.md
      - .agents/**
      - ios/**
      - scripts/ios-live/**
      - scripts/brand/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - slate/**
      - .github/workflows/slate.yml
      # Prose, agent instructions and the iOS app never reach the image or a
      # Rust test. docs/mcp-policy.json (read by omni-mcp tests) and
      # docs/licenses/ (copied into the image) still trigger a run.
      - 'docs/**/*.md'
      - AGENTS.md
      - README.md
      - .agents/**
      - ios/**
      - scripts/ios-live/**
      - scripts/brand/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental output is never reused across CI runs and doubles the cache.
  CARGO_INCREMENTAL: 0

# Actions are pinned to full commit SHAs; the comment names the release.
#
# lint, test, server and web start together. Each restores its own
# whole-target cache (.github/actions/cargo-cache) saved by the newest main
# commit, with file mtimes set to commit times, so only crates changed since
# then rebuild. See docs/ci.md.
#
# server compiles the release binaries in the Dockerfile's own Rust image (same
# glibc as the runtime) and web builds both release bundles. publish runs only
# after all four pass and packages both artifacts (SERVER_SOURCE=prebuilt,
# WEB_SOURCE=prebuilt) in one Docker build that pushes; nothing untested
# reaches the registry. Pull requests build everything but neither push nor
# save caches.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history dates each file for restore-mtimes.py.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components.
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Restore the lint build
        uses: ./.github/actions/cargo-cache
        with:
          name: lint
          mode: restore

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        # Clippy runs build scripts too, including sherpa-onnx-sys's, which reads it.
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint the web crates for wasm32
        run: >-
          cargo clippy -p omni-web -p omni-web-kit -p omni-web-pages
          -p omni-recipes-web -p omni-recipe-format
          --target wasm32-unknown-unknown --all-targets --locked -- -D warnings

      - name: Check crate dependency direction
        run: cargo xtask deps-check

      - name: Save the lint build
        # After deps-check, so the cache holds xtask's build too.
        uses: ./.github/actions/cargo-cache
        with:
          name: lint
          mode: save

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --locked check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml selects the version and components. Tests run on
        # the host target only, so wasm32 is not installed here.
        run: rustup toolchain install

      - name: Install the legacy time zone names
        # Ubuntu 26.04 moved the backward-compatible names (Asia/Calcutta,
        # US/Pacific) to tzdata-legacy. The runtime image's Debian tzdata has
        # them, and jiff reads the system zoneinfo before its bundled copy.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tzdata-legacy

      - name: Restore the test build
        uses: ./.github/actions/cargo-cache
        with:
          name: test
          mode: restore

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        # The library is extracted outside target/ and linked through
        # SHERPA_ONNX_LIB_DIR: sherpa-onnx-sys otherwise extracts into
        # target/sherpa-onnx-prebuilt, which the Cargo cache does not keep while
        # its cached build-script output still points there.
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-nextest@0.9.143

      - name: Build tests
        run: cargo nextest run --workspace --locked --profile ci --no-run

      - name: Run tests
        # The ci profile in .config/nextest.toml: no retries, no fail-fast, and
        # hung tests are terminated. The workspace has no doctests, which nextest
        # would skip; add `cargo test --workspace --locked --doc` if that changes.
        run: cargo nextest run --workspace --locked --profile ci

      - name: Save the test build
        # A failing test still leaves a valid build to start the fix from.
        if: success() || failure()
        uses: ./.github/actions/cargo-cache
        with:
          name: test
          mode: save

  # The release binaries, built where they will run: the Dockerfile's Rust image
  # (Debian bookworm, like the node:*-slim runtime), with the same packages and
  # profile as the Dockerfile's server-build stage.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: rust:1.97.1-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust the checkout
        # The container runs as root over a checkout owned by the runner user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the pinned Rust toolchain and zstd for the cache
        run: |
          rustup toolchain install
          apt-get update -qq && apt-get install -y -qq zstd

      - name: Restore the release build
        uses: ./.github/actions/cargo-cache
        with:
          name: release-server
          mode: restore
          cargo-home: /usr/local/cargo

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Fetch the verified sherpa-onnx static library
        run: |
          deploy/sherpa-onnx/fetch-static-lib.sh "$RUNNER_TEMP/sherpa-onnx"
          tar -xjf "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib.tar.bz2 -C "$RUNNER_TEMP/sherpa-onnx"
          echo "SHERPA_ONNX_LIB_DIR=$(echo "$RUNNER_TEMP"/sherpa-onnx/sherpa-onnx-v*-static-lib/lib)" >> "$GITHUB_ENV"

      - name: Build the release binaries
        run: >-
          cargo build --release --locked -p omni -p omni-live-intel
          --bin omni --bin omni-voice-enroll --bin omni-intel-doctor

      - name: Save the release build
        uses: ./.github/actions/cargo-cache
        with:
          name: release-server
          mode: save
          cargo-home: /usr/local/cargo

      - name: Package the binaries
        # A tarball keeps the executable bits that artifacts drop.
        run: >-
          tar -C target/release -cf server.tar
          omni omni-voice-enroll omni-intel-doctor

      - name: Upload the binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server.tar
          retention-days: 1
          if-no-files-found: error

  # Both release bundles (Omni and Fond) with the pinned tools, compressed the
  # way the Dockerfile's web-dist-build stage does, for WEB_SOURCE=prebuilt.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown

      - name: Install the pinned frontend tools and brotli
        run: |
          deploy/web-tools/install.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli

      - name: Restore the web build
        uses: ./.github/actions/cargo-cache
        with:
          name: web
          mode: restore

      - name: Date files so only crates changed since the cached build rebuild
        run: python3 scripts/ci/restore-mtimes.py

      - name: Build Omni's bundle
        run: cd crates/omni-web && trunk build --release --locked

      - name: Build Fond's bundle
        # Its post-build hook writes sw.js before the compressed copies exist.
        run: cd crates/omni-recipes-web && trunk build --release --locked

      - name: Save the web build
        uses: ./.github/actions/cargo-cache
        with:
          name: web
          mode: save

      - name: Compress and package the bundles
        # The SPA service serves .br/.gz siblings when the client accepts them.
        # A tarball keeps the layout exactly as the Dockerfile copies it.
        run: |
          mkdir -p prebuilt/web
          cp -R crates/omni-web/dist prebuilt/web/dist
          cp -R crates/omni-recipes-web/dist prebuilt/web/recipes-dist
          find prebuilt/web -type f \
            \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.wasm' \) \
            -exec brotli -k -q 11 {} + -exec gzip -k -n -9 {} +
          tar -C prebuilt/web -cf web.tar dist recipes-dist

      - name: Upload the bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: web.tar
          retention-days: 1
          if-no-files-found: error

  # Packages the tested binaries and bundles into the image and pushes it
  # (main only). Its own steps are downloads and the runtime layers.
  publish:
    runs-on: ubuntu-latest
    needs: [lint, test, server, web]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the server binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server

      - name: Download the web bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web

      - name: Unpack them into the build context
        run: |
          mkdir -p prebuilt/server prebuilt/web
          tar -C prebuilt/server -xf server.tar && rm server.tar
          tar -C prebuilt/web -xf web.tar && rm web.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            OMNI_REVISION=${{ github.sha }}
            SERVER_SOURCE=prebuilt
            WEB_SOURCE=prebuilt
          tags: |
            ghcr.io/${{ github.repository_owner }}/omni:latest
            ghcr.io/${{ github.repository_owner }}/omni:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # mode=max keeps every stage (downloads, models, runtime layers).
          cache-from: type=gha,scope=omni
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=omni,mode=max,ignore-error=true' || '' }}

      - name: Logout from GitHub Container Registry
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io

  # Each main commit saves its own Cargo cache keys, so delete superseded ones
  # before they crowd the repository's 10 GB cache quota: keep the newest entry
  # of each cache name (grouped without the commit and toolchain hash, so a
  # toolchain bump drops the old toolchain's build too). Also removes the retired Swatinem/rust-cache entries.
  prune:
    runs-on: ubuntu-latest
    needs: [lint, test, server, web]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete superseded Cargo caches
        run: |
          gh cache list --ref refs/heads/main --limit 1000 --json id,key,createdAt \
            --jq '(map(select(.key | startswith("v0-rust-"))) | .[].id),
                  (map(select(.key | startswith("cargo-")))
                   | group_by(.key | split("-")[:-2] | join("-"))
                   | map(sort_by(.createdAt) | .[:-1][]) | .[].id)' |
          while read -r id; do gh cache delete "$id"; done

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, server, web, publish]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.lint.result == 'failure' || needs.test.result == 'failure' ||
      needs.server.result == 'failure' || needs.web.result == 'failure' ||
      needs.publish.result == 'failure')

    steps:
      - name: Send CI failure notification
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          TITLE="omni CI failed"
          FAILED=""
          [ "${{ needs.lint.result }}" = "failure" ] && FAILED="lint"
          [ "${{ needs.test.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }test"
          [ "${{ needs.server.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }server"
          [ "${{ needs.web.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }web"
          [ "${{ needs.publish.result }}" = "failure" ] && FAILED="${FAILED:+$FAILED, }publish"
          MESSAGE="Failed jobs: ${FAILED}"
          curl -s -o /dev/null \
            --form-string "token=$PUSHOVER_TOKEN" \
            --form-string "user=$PUSHOVER_USER" \
            --form-string "title=$TITLE" \
            --form-string "message=$MESSAGE" \
            --form-string "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --form-string "url_title=View run" \
            --form-string "priority=1" \
            https://api.pushover.net/1/messages.json
