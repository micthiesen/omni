[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/omni"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"          # omni-live-intel uses the safe sherpa-onnx wrapper only
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"            # allowed in tests via clippy.toml
expect_used = "warn"
dbg_macro = "warn"
print_stdout = "warn"           # logging goes through tracing; xtask opts out with #![allow]
print_stderr = "warn"
let_underscore_future = "deny"  # no silently dropped futures
large_futures = "warn"

[workspace.dependencies]
# Internal crates.
omni-core = { path = "crates/omni-core" }
omni-config = { path = "crates/omni-config" }
omni-store = { path = "crates/omni-store" }
omni-tasks = { path = "crates/omni-tasks" }
omni-http = { path = "crates/omni-http" }
omni-alerts = { path = "crates/omni-alerts" }
omni-mailer = { path = "crates/omni-mailer" }
omni-ai = { path = "crates/omni-ai" }
omni-server-kit = { path = "crates/omni-server-kit" }
omni-mcp-kit = { path = "crates/omni-mcp-kit" }
omni-runtime = { path = "crates/omni-runtime" }
omni-api = { path = "crates/omni-api" }
omni-testkit = { path = "crates/omni-testkit" }
omni-email = { path = "crates/omni-email" }
omni-parcel = { path = "crates/omni-parcel" }
omni-imap = { path = "crates/omni-imap" }
omni-live-intel = { path = "crates/omni-live-intel" }
omni-media = { path = "crates/omni-media" }
omni-arr = { path = "crates/omni-arr" }
omni-calendar = { path = "crates/omni-calendar" }
omni-reminders = { path = "crates/omni-reminders" }
omni-personal = { path = "crates/omni-personal" }
omni-live = { path = "crates/omni-live" }
omni-ios-controls = { path = "crates/omni-ios-controls" }
omni-podcasts = { path = "crates/omni-podcasts" }
omni-mcp = { path = "crates/omni-mcp" }
omni-device-link = { path = "crates/omni-device-link" }
omni-web-kit = { path = "crates/omni-web-kit" }
omni-web-pages = { path = "crates/omni-web-pages" }
omni-presspods = { path = "crates/omni-presspods" }
omni-stylist = { path = "crates/omni-stylist" }

# Exact pins (see AGENTS.md, Rust conventions). Every version was published on or
# before 2026-09-25 and resolves together (checked with cargo generate-lockfile).
ego-tree = "=0.11.0"  # scraper DOM traversal for html_to_text
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "fs", "net", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt", "io"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
futures = "=0.3.34"
bashkit = { version = "=0.19.0", default-features = false, features = ["jq"] }  # the gateway `shell` tool
axum = { version = "=0.8.9", features = ["json", "query", "macros", "tokio", "http1", "http2"] }
tower = { version = "=0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "=0.7.1", features = ["fs", "trace", "set-header", "limit", "timeout", "compression-br", "compression-gzip"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2", "charset", "json", "stream", "gzip", "brotli", "query", "form", "multipart", "cookies"] }
rustls = "=0.23.46"
tokio-rustls = "=0.26.5"
rustls-platform-verifier = "=0.7.1"
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup", "limits"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip", "preserve_order"] }
serde_with = "=3.23.0"
indexmap = { version = "=2.14.2", features = ["serde"] }
ryu-js = "=1.0.3"
icu_collator = { version = "=2.3.1", features = ["compiled_data"] }
schemars = "=1.2.2"
jsonschema = { version = "=0.58.0", default-features = false }
jiff = { version = "=0.2.37", features = ["serde", "tzdb-bundle-always"] }
croner = { version = "=4.0.0", default-features = false, features = ["jiff"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "registry", "std"] }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
rmcp = { version = "=3.4.1", default-features = false, features = ["base64", "server", "transport-streamable-http-server"] }
imap-proto = "=0.16.7"
mail-parser = { version = "=0.11.9", features = ["full_encoding"] }
mail-builder = "=1.0.0"
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "aws-lc-rs", "builder"] }
scraper = "=0.27.0"
htmd = "=0.5.5"
dom_smoothie = "=0.18.2"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
id3 = "=1.17.2"
sherpa-onnx = "=1.13.8"
# Must equal the static archive version in deploy/sherpa-onnx/fetch-static-lib.sh.
sherpa-onnx-sys = "=1.13.8"
ipp = { version = "=7.0.0", default-features = false, features = ["async-client-rustls"] }
aws-cognito-srp = "=0.2.5"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
aes-gcm = "=0.11.1"
subtle = "=2.6.1"
base64 = "=0.23.1"
hex = "=0.4.3"
flate2 = "=1.1.10"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
rand = "=0.10.3"
regex = "=1.13.1"
bytes = "=1.12.1"
http = "=1.5.0"
moka = { version = "=0.12.16", features = ["future"] }
leptos = { version = "=0.8.20", features = ["csr"] }
gloo-net = { version = "=0.7.0", features = ["http", "eventsource"] }
gloo-timers = { version = "=0.4.0", features = ["futures"] }
wasm-bindgen = "=0.2.129"
web-sys = "=0.3.106"
js-sys = "=0.3.106"
wasm-bindgen-futures = "=0.4.79"
wasm-bindgen-test = "=0.3.79"
console_error_panic_hook = "=0.1.7"
pulldown-cmark = { version = "=0.13.4", default-features = false }
wiremock = "=0.6.5"
tempfile = "=3.27.0"
proptest = "=1.11.0"
icu_normalizer = { version = "=2.3.0", features = ["compiled_data"] }
num-bigint = "=0.5.1"
libc = "=0.2.190"
html-escape = "=0.2.15"

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
overflow-checks = true
[profile.wasm-release]          # used by trunk for omni-web
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
